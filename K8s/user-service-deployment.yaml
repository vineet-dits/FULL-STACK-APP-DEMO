apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fullstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: vineetsaini13/user-service:v1
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_USER
          value: admin
        - name: DB_PASS
          value: admin123
        ports:
        - containerPort: 3000