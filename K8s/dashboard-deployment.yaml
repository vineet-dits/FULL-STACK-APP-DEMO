apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: fullstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
    spec:
      containers:
      - name: dashboard-service
        image: vineetsaini13/dashboard:v1
        env:
        - name: PORT
          value: "3002"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: microservices_db
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: JWT_SECRET
          value: dev-secret-change-me
        ports:
        - containerPort: 3002